<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" width="1280" height="700" role="img" aria-label="Vercel 배포 흐름 — 코드가 올라가는 길과 요청이 지나가는 길">
<title>Vercel 배포 흐름 (2026-11-18 기준)</title>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b636b"/></marker>
<style>
text{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;fill:#1f2328}
.t{font-size:22px;font-weight:700}
.sub{font-size:12.5px;fill:#5b636b}
.sec{font-size:12.5px;font-weight:700;fill:#5b636b}
.h{font-size:12.5px;font-weight:700}
.d{font-size:10.5px;fill:#5b636b}
.ar{font-size:10px;fill:#5b636b}
.ok{font-size:11px}
.box{fill:#fff;stroke:#c9ccd1;stroke-width:1.5}
.warm{fill:#fff6df;stroke:#d9b45a;stroke-width:1.5}
.cool{fill:#e8f1fb;stroke:#7fa8d6;stroke-width:1.5}
.good{fill:#e6f4ea;stroke:#7bb88a;stroke-width:1.5}
.line{stroke:#5b636b;stroke-width:1.5;fill:none;marker-end:url(#ah)}
</style>
</defs>
<rect width="1280" height="700" fill="#fbfaf7"/>
<text x="30" y="40" class="t">Vercel 배포 흐름 — 코드가 올라가는 길과 요청이 지나가는 길</text>
<text x="30" y="64" class="sub">2026-11-18 기준. 모의 값만 쓰는 시험 배포(jiacenter-web.vercel.app). 파랑 = 오늘 로그·화면으로 확인한 것, 노랑 = 아직 미확인.</text>

<text x="30" y="100" class="sec">① 올리는 길 (배포)</text>
<rect x="30" y="110" width="200" height="92" rx="8" class="box"/>
<text x="130" y="130" class="h" text-anchor="middle">내 컴퓨터</text>
<text x="130" y="150" class="d" text-anchor="middle">코드 수정·시험</text>
<text x="130" y="167" class="d" text-anchor="middle">harness_script/verify.sh</text>
<text x="130" y="184" class="d" text-anchor="middle">(시험·마이그레이션·개인정보)</text>

<rect x="280" y="110" width="200" height="92" rx="8" class="box"/>
<text x="380" y="130" class="h" text-anchor="middle">GitHub PR</text>
<text x="380" y="150" class="d" text-anchor="middle">CI: test · track</text>
<text x="380" y="167" class="d" text-anchor="middle">push 는 브랜치로만</text>

<rect x="530" y="110" width="200" height="92" rx="8" class="warm"/>
<text x="630" y="130" class="h" text-anchor="middle">main 에 병합</text>
<text x="630" y="150" class="d" text-anchor="middle">병합은 사용자가 직접</text>
<text x="630" y="167" class="d" text-anchor="middle">(Claude 는 병합하지 않음)</text>

<rect x="780" y="110" width="250" height="92" rx="8" class="cool"/>
<text x="905" y="130" class="h" text-anchor="middle">Vercel 자동 빌드</text>
<text x="905" y="148" class="d" text-anchor="middle">Root Directory = src</text>
<text x="905" y="163" class="d" text-anchor="middle">pip install -r requirements.txt</text>
<text x="905" y="178" class="d" text-anchor="middle">python build.py → migrate · seed_dummy</text>
<text x="905" y="193" class="d" text-anchor="middle">collectstatic (STATIC_ROOT 있으면 자동)</text>

<rect x="1080" y="110" width="170" height="92" rx="8" class="cool"/>
<text x="1165" y="130" class="h" text-anchor="middle">배포 완료</text>
<text x="1165" y="150" class="d" text-anchor="middle">Production 주소</text>
<text x="1165" y="167" class="d" text-anchor="middle">jiacenter-web</text>
<text x="1165" y="182" class="d" text-anchor="middle">.vercel.app</text>
<path class="line" d="M230,156 H278"/><path class="line" d="M480,156 H528"/><path class="line" d="M730,156 H778"/><path class="line" d="M1030,156 H1078"/>
<text x="254" y="148" class="ar" text-anchor="middle">push</text>
<text x="504" y="148" class="ar" text-anchor="middle">병합</text>
<text x="754" y="148" class="ar" text-anchor="middle">자동</text>

<text x="30" y="250" class="sec">② 접속하는 길 (실행) — 요청이 올 때만 앱이 켜지는 서버리스</text>
<rect x="30" y="262" width="190" height="112" rx="8" class="box"/>
<text x="125" y="282" class="h" text-anchor="middle">브라우저</text>
<text x="125" y="302" class="d" text-anchor="middle">방문자·보호자</text>
<text x="125" y="318" class="d" text-anchor="middle">직원 (현황판)</text>
<text x="125" y="334" class="d" text-anchor="middle">현관 키오스크</text>

<rect x="290" y="262" width="230" height="112" rx="8" class="warm"/>
<text x="405" y="282" class="h" text-anchor="middle">Vercel 앞단</text>
<text x="405" y="302" class="d" text-anchor="middle">HTTPS 인증서 자동 발급·갱신(문서)</text>
<text x="405" y="318" class="d" text-anchor="middle">X-Forwarded-Proto 전달 →</text>
<text x="405" y="334" class="d" text-anchor="middle">DJANGO_BEHIND_PROXY=1 로 받음</text>
<text x="405" y="352" class="d" text-anchor="middle">.vercel.app 인증서·자물쇠: 미확인</text>

<rect x="590" y="262" width="260" height="112" rx="8" class="cool"/>
<text x="720" y="282" class="h" text-anchor="middle">Django 함수 (앱 전체가 함수 하나)</text>
<text x="720" y="302" class="d" text-anchor="middle">config/wsgi.py → center/views.py</text>
<text x="720" y="318" class="d" text-anchor="middle">출결 판정은 _toggle() 한 곳</text>
<text x="720" y="334" class="d" text-anchor="middle">시작 때 로그 파일을 못 열어 죽었던 곳</text>
<text x="720" y="352" class="d" text-anchor="middle">→ VERCEL=1 이면 로그를 콘솔로</text>

<rect x="920" y="262" width="320" height="52" rx="8" class="warm"/>
<text x="1080" y="282" class="h" text-anchor="middle">DB: 빌드 때 만든 빈 SQLite</text>
<text x="1080" y="300" class="d" text-anchor="middle">실행 환경 파일 시스템은 읽기 전용 → 쓰기(로그인·출결) 미확인</text>
<rect x="920" y="326" width="320" height="48" rx="8" class="cool"/>
<text x="1080" y="346" class="h" text-anchor="middle">로그: Vercel 로그 화면(콘솔)</text>
<text x="1080" y="363" class="d" text-anchor="middle">logs/ 폴더는 만들지 않음 (로컬은 기존대로 파일)</text>
<path class="line" d="M220,318 H288"/><path class="line" d="M520,318 H588"/><path class="line" d="M850,288 H918"/><path class="line" d="M850,350 H918"/>
<text x="254" y="310" class="ar" text-anchor="middle">https</text>
<text x="554" y="310" class="ar" text-anchor="middle">요청</text>

<text x="30" y="422" class="sec">③ 설정과 지금 상태</text>
<rect x="30" y="432" width="600" height="228" rx="8" class="box"/>
<text x="46" y="454" class="h">Vercel 대시보드에 넣은 환경변수 (값은 문서·코드에 적지 않음)</text>
<text x="46" y="478" class="ok">DJANGO_DEBUG = 0 — 운영 모드(에러 화면 숨김, 보안 설정 켜짐)</text>
<text x="46" y="498" class="ok">DJANGO_SECRET_KEY — 세션·서명용 비밀 값</text>
<text x="46" y="518" class="ok">DJANGO_ALLOWED_HOSTS = .vercel.app — 접속 허용 주소</text>
<text x="46" y="538" class="ok">DJANGO_BEHIND_PROXY = 1 — 앞단이 HTTPS 를 처리한다고 알림</text>
<text x="46" y="558" class="ok">VERCEL = 1 — Vercel 이 자동으로 넣어 줌(시스템 변수, 공식 문서)</text>
<text x="46" y="582" class="d">DJANGO_LOG_TO_CONSOLE=1 도 같은 스위치를 켠다(대시보드에 넣었으나 반영 여부 미확인).</text>
<text x="46" y="602" class="d">쓰지 않는 것: src/deploy/ 의 Caddyfile·jiacenter.service (서버를 직접 빌려 쓸 때용 견본)</text>
<text x="46" y="622" class="d">Vercel 은 일단 해 보는 단계이고 운영 서비스로 확정한 것은 아님(강사님 권유, 2026-11-18).</text>
<text x="46" y="646" class="d">실제 정보를 넣기 전에는 영구 DB 와 "실제 데이터 투입 전 체크리스트"가 필요하다.</text>

<rect x="660" y="432" width="590" height="228" rx="8" class="box"/>
<text x="676" y="454" class="h">지금 상태</text>
<rect x="676" y="466" width="558" height="86" rx="6" class="good"/>
<text x="688" y="486" class="h">확인됨 (로그·화면)</text>
<text x="688" y="504" class="ok">· 실행 환경 파일 시스템은 읽기 전용 (로그 Errno 30)</text>
<text x="688" y="522" class="ok">· 로그를 콘솔로 돌린 뒤 홈 화면이 뜸 (센터 이름은 기본값으로 표시)</text>
<text x="688" y="540" class="ok">· 업로드 한도 4MB (Vercel 요청 본문 4.5MB 한도 때문)</text>
<rect x="676" y="562" width="558" height="86" rx="6" class="warm"/>
<text x="688" y="582" class="h">미확인</text>
<text x="688" y="600" class="ok">· 로그인·출결 저장 (읽기 전용 DB 에 쓰기)  · 앨범 사진이 남는지</text>
<text x="688" y="618" class="ok">· .vercel.app HTTPS 인증서와 DJANGO_BEHIND_PROXY 필요 여부</text>
<text x="688" y="636" class="ok">· 무료 한도  · 직접 산 도메인 연결</text>
</svg>
