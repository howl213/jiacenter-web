name: audit

# 의존성 취약점 점검. 새 취약점이 공개되면 PR 과 상관없이 결과가 바뀌므로 PR 조건으로 두지 않고
# 매주 한 번, 그리고 손으로 실행할 때만 돌린다.
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
