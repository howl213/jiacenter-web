<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" font-family="-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>하네스가 끼어드는 순간</title><rect width="800" height="800" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g transform="translate(0,140)"><text x="40" y="34" font-size="13" fill="#5F5E5A">Claude 와 작업하는 중</text><rect x="40" y="50" width="220" height="48" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text x="150.0" y="74.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#2C2C2A">세션이 열릴 때</text><line x1="150" y1="98" x2="150" y2="150" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/><rect x="40" y="152" width="220" height="62" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="150.0" y="175.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#26215C">session_brief</text><text x="150.0" y="195.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#534AB7">지금 상태와 두 목표를 알려 줌</text><rect x="290" y="50" width="220" height="48" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text x="400.0" y="74.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#2C2C2A">명령을 실행하기 직전</text><line x1="400" y1="98" x2="400" y2="150" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/><rect x="290" y="152" width="220" height="62" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="400.0" y="175.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#26215C">claude_guard</text><text x="400.0" y="195.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#534AB7">위험하면 막거나 사람에게 물음</text><rect x="540" y="50" width="220" height="48" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text x="650.0" y="74.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#2C2C2A">답변을 끝낼 때</text><line x1="650" y1="98" x2="650" y2="150" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/><rect x="540" y="152" width="220" height="62" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="650.0" y="175.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#26215C">stop_check</text><text x="650.0" y="195.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#534AB7">단정 표현이면 경고</text><line x1="260" y1="74" x2="288" y2="74" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/><line x1="510" y1="74" x2="538" y2="74" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/><line x1="40" y1="250" x2="760" y2="250" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 4"/><text x="40" y="278" font-size="13" fill="#5F5E5A">코드를 저장소에 올리는 길</text><rect x="40" y="294" width="220" height="48" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text x="150.0" y="318.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#2C2C2A">커밋할 때</text><line x1="150" y1="342" x2="150" y2="394" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/><rect x="40" y="396" width="220" height="62" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="150.0" y="419.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#26215C">pre-commit</text><text x="150.0" y="439.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#534AB7">개인정보면 커밋 거부</text><rect x="290" y="294" width="220" height="48" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text x="400.0" y="318.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#2C2C2A">PR 을 올릴 때</text><line x1="400" y1="342" x2="400" y2="394" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/><rect x="290" y="396" width="220" height="62" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="400.0" y="419.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#26215C">GitHub CI</text><text x="400.0" y="439.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#534AB7">테스트·갈래·정적 점검</text><rect x="540" y="294" width="220" height="48" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text x="650.0" y="318.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#2C2C2A">/verify 를 부를 때</text><line x1="650" y1="342" x2="650" y2="394" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/><rect x="540" y="396" width="220" height="62" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="650.0" y="419.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#26215C">verify.sh</text><text x="650.0" y="439.0" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#534AB7">여섯 점검을 한 번에</text><line x1="260" y1="318" x2="288" y2="318" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/><text x="40" y="500" font-size="12.5" fill="#5F5E5A">회색 = 일어나는 순간,  보라 = 그 순간에 자동으로 도는 프로그램</text></g></svg>