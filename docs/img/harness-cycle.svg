<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" font-family="-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"><title>작업 한 번의 사이클</title><rect width="800" height="800" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g transform="translate(0,260)"><rect x="40" y="40" width="150" height="66" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="115.0" y="65.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">1 요청</text><text x="115.0" y="85.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">사용자</text><line x1="190" y1="73" x2="218" y2="73" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/><rect x="220" y="40" width="150" height="66" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text x="295.0" y="65.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">2 목표 말하기</text><text x="295.0" y="85.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">어느 목표인지</text><line x1="370" y1="73" x2="398" y2="73" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/><rect x="400" y="40" width="150" height="66" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text x="475.0" y="65.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">3 만들고 실제 실행</text><text x="475.0" y="85.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">테스트·이상 입력</text><line x1="550" y1="73" x2="578" y2="73" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/><rect x="580" y="40" width="150" height="66" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text x="655.0" y="65.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">4 보고</text><text x="655.0" y="85.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">확인한 것 / 못 한 것</text><rect x="40" y="170" width="150" height="66" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="115.0" y="195.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">5 결정</text><text x="115.0" y="215.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">PR 올릴지, 범위</text><line x1="190" y1="203" x2="218" y2="203" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/><rect x="220" y="170" width="150" height="66" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text x="295.0" y="195.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">6 커밋</text><text x="295.0" y="215.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">개인정보 검사</text><line x1="370" y1="203" x2="398" y2="203" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/><rect x="400" y="170" width="150" height="66" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/><text x="475.0" y="195.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">7 푸시와 CI</text><text x="475.0" y="215.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">자동 점검</text><line x1="550" y1="203" x2="578" y2="203" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/><rect x="580" y="170" width="150" height="66" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/><text x="655.0" y="195.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#26215C">8 병합</text><text x="655.0" y="215.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">사람이 확인하고 누름</text><polyline points="655,106 655,138 115,138 115,168" fill="none" stroke="#5F5E5A" stroke-width="1.6" marker-end="url(#a)"/><text x="40" y="250" font-size="12" fill="#5F5E5A">보라 = 사람이 하는 일,  회색 = Claude·프로그램이 하는 일</text></g></svg>